[project]
name = "arteci-date-api"
version = "1.0.0"
description = "High-performance date-format standardization API for ARTECI (Polars + FastAPI + MinIO + OpenTelemetry)."
requires-python = ">=3.12"
readme = "README.md"

# Runtime dependencies are pinned in requirements.txt (and requirements-dev.txt
# for tests/benchmark). pyproject here carries project metadata + tool config.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI uses function calls (Depends/Query) in defaults

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
